<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Samu-Enjoyer</title>
    <meta
      name="description"
      content="Samu-Enjoyer: respuestas a preguntas de derecho colombiano citando solo normas y sentencias del corpus recuperado. Hackathon IA Week 2026."
    />
    <script>
      // Tema guardado antes del primer pintado (oscuro por defecto, la paleta del logo).
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.classList.toggle("dark", t ? t === "dark" : true);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
